services:
  db:
    image: postgres:16-alpine
    container_name: kebab-guide-db
    environment:
      POSTGRES_USER: kebab
      POSTGRES_PASSWORD: kebab
      POSTGRES_DB: kebab_guide
    ports:
      - '5432:5432'
    volumes:
      - kebab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kebab -d kebab_guide']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kebab_pgdata:
